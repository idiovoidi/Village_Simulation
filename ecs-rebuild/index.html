<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f16">
  <title>Village Sim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 16 16 5l12 11h-3v11H7V16z' fill='%23f2b84b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/ui/hud.css">
</head>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>

  <div id="loadingScreen" role="status">
    <div class="spinner"></div>
    <h2>Village Sim</h2>
    <p>Waking the villagers…</p>
  </div>

  <div id="errorScreen">
    <h2>Couldn't start the simulation</h2>
    <div id="errorMessage"></div>
  </div>

  <!-- Babylon.js and Havok are loaded from the CDN as globals (see src/types/babylon-globals.d.ts). -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
